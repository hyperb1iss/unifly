[package]
name = "unifly"
description = "CLI and TUI for managing UniFi network controllers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["unifi", "ubiquiti", "networking", "cli", "tui"]
categories = ["command-line-utilities", "network-programming"]
readme = "../../README.md"

[lints]
workspace = true

[features]
default = ["cli", "tui", "tui-graphics"]
cli = [
    "dep:opaline",
    "dep:clap_complete",
    "dep:miette",
    "dep:tabled",
    "dep:owo-colors",
    "dep:dialoguer",
    "dep:rpassword",
    "dep:serde_yaml_ng",
]
tui = [
    "cli",
    "dep:opaline",
    "dep:ratatui",
    "dep:crossterm",
    "dep:tachyonfx",
    "dep:throbber-widgets-tui",
    "dep:color-eyre",
    "dep:tracing-appender",
    "dep:futures",
    "dep:tokio-util",
]
tui-graphics = [
    "tui",
    "dep:image",
    "dep:ratatui-image",
    "dep:tiny-skia",
]
e2e = []

[[bin]]
name = "unifly"
path = "src/bin/cli.rs"
required-features = ["cli"]

# ── Shared dependencies (always present) ─────────────────────────
[dependencies]
unifly-api         = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
serde              = { workspace = true }
serde_json         = { workspace = true }
clap               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
chrono             = { workspace = true }
secrecy            = { workspace = true }
thiserror          = { workspace = true }
url                = { workspace = true }

# Config deps (shared by CLI and TUI)
figment            = { workspace = true }
toml               = { workspace = true }
keyring            = { workspace = true }
directories        = { workspace = true }

# Demo mode sanitization
regex              = { workspace = true }
dashmap            = { workspace = true }

# ── CLI-only deps (optional) ─────────────────────────────────────
clap_complete      = { workspace = true, optional = true }
miette             = { workspace = true, optional = true }
tabled             = { workspace = true, optional = true }
owo-colors         = { workspace = true, optional = true }
dialoguer          = { workspace = true, optional = true }
rpassword          = { workspace = true, optional = true }
serde_yaml_ng      = { workspace = true, optional = true }

# ── TUI/theme deps (optional) ────────────────────────────────────
opaline            = { workspace = true, optional = true }
ratatui            = { workspace = true, optional = true }
crossterm          = { workspace = true, optional = true }
tachyonfx          = { workspace = true, optional = true, features = ["sendable"] }
throbber-widgets-tui = { workspace = true, optional = true }
ratatui-image     = { workspace = true, optional = true }
color-eyre         = { workspace = true, optional = true }
tracing-appender   = { workspace = true, optional = true }
image              = { workspace = true, optional = true }
tiny-skia          = { workspace = true, optional = true }
futures            = { workspace = true, optional = true }
tokio-util         = { workspace = true, optional = true }
json_comments = "0.2.2"

[build-dependencies]
clap               = { workspace = true }
clap_complete      = { workspace = true }
clap_mangen        = { workspace = true }

[dev-dependencies]
assert_cmd         = { workspace = true }
predicates         = { workspace = true }
insta              = { workspace = true }
tempfile           = { workspace = true }
wiremock           = { workspace = true }
tokio              = { workspace = true, features = ["test-util"] }
pretty_assertions  = { workspace = true }
uuid               = { workspace = true }

[package.metadata.dist]
dist = true
