name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  e2e:
    name: Controller E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNIFLY_E2E_TIMEOUT_SECS: "300"
      # UNIFLY_E2E_API_KEY is deliberately not exported: this job targets
      # the simulation controller, which cannot accept an Integration key,
      # so the integration_profile_* lane skips here. That lane runs
      # against a real UniFi OS console; see CONTRIBUTING.md.
    steps:
      - uses: actions/checkout@v7

      - name: Start controller
        run: docker compose -f tests/e2e/docker-compose.yml up -d

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config lld

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@just

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build e2e test binary
        run: just e2e-build

      - name: Wait for controller readiness
        run: just e2e-wait

      - name: Run e2e tests
        run: just e2e-test

      - name: Capture controller logs
        if: failure()
        run: docker compose -f tests/e2e/docker-compose.yml logs > tests/e2e/controller.log

      - name: Upload controller logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-controller-logs
          path: tests/e2e/controller.log
          if-no-files-found: ignore

      - name: Tear down controller
        if: always()
        run: just e2e-down
